services:
  quant-research:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: quant-research:py3.12
    container_name: quant-research
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ./data:/workspace/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    ports:
      # hikyuu dataserver（行情推送，tcp 协议）
      - "127.0.0.1:9201:9201"
      # hikyuu spot_server（实时行情）
      - "127.0.0.1:9200:9200"
    tty: true
    stdin_open: true
    command: bash
    # 不配置任何真实账号或 Token

  jupyter:
    image: quant-research:py3.12
    container_name: quant-jupyter
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ./data:/workspace/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - JUPYTER_PORT=${JUPYTER_PORT:-8888}
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:?Set a nonempty JUPYTER_TOKEN outside Git}
    ports:
      # 仅绑定 Windows localhost，不对局域网暴露
      - "127.0.0.1:8888:8888"
    # 直接在命令行指定参数：--ip=0.0.0.0 必需（否则容器只绑 loopback，宿主机端口映射进不来）
    # Authentication is mandatory; Compose and the child shell both reject an empty token.
    command: >
      bash -c "
      : \"$${JUPYTER_TOKEN:?A nonempty external token is required}\";
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --IdentityProvider.token=\"$${JUPYTER_TOKEN}\"
      --ServerApp.allow_root=True
      --notebook-dir=/workspace
      "
    restart: unless-stopped
