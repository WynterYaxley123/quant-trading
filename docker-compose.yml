services:
  quant-research:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: quant-research:py3.12
    container_name: quant-research
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ./data:/workspace/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    ports:
      # hikyuu dataserver（行情推送，tcp 协议）
      - "127.0.0.1:9201:9201"
      # hikyuu spot_server（实时行情）
      - "127.0.0.1:9200:9200"
    tty: true
    stdin_open: true
    command: bash
    # 不配置任何真实账号或 Token

  jupyter:
    image: quant-research:py3.12
    container_name: quant-jupyter
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ./data:/workspace/data
    # env_file 不做 $ 插值，密码哈希原样注入容器（关键：不能用 environment 写 ${...}）
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - JUPYTER_PORT=${JUPYTER_PORT:-8888}
    ports:
      # 仅绑定 Windows localhost，不对局域网暴露
      - "127.0.0.1:8888:8888"
    # 直接在命令行指定参数：--ip=0.0.0.0 必需（否则容器只绑 loopback，宿主机端口映射进不来）
    # $$ 是 compose 转义，输出为 $，由 shell 展开容器内的 JUPYTER_PASSWORD 环境变量
    command: >
      bash -c "
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --ServerApp.token=''
      --ServerApp.password=\"$${JUPYTER_PASSWORD}\"
      --ServerApp.password_required=True
      --ServerApp.allow_root=True
      --notebook-dir=/workspace
      "
    restart: unless-stopped
