# Tool configuration only: strategy packages retain their existing architecture.
[tool.pytest.ini_options]
testpaths = ["tests", "strategies/sw_sector_rotation/tests"]
pythonpath = ["."]
addopts = "--strict-markers -m 'not integration'"
markers = [
  "unit: deterministic repository/synthetic fixture test",
  "integration: integration test, possibly requiring a maintainer runtime",
  "external_runtime: requires frozen frameworks or private runtime evidence",
  "network: explicit online data-source test; must also carry integration",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache"] # Generated audit/build output, never application code.
force-exclude = true # Pre-commit passes explicit filenames; honor certified bytes.

[tool.ruff.lint]
# Conservative correctness/imports/modernization and useful bug/simplification
# rules, with no blanket directory exclusions. B905 is deferred: strict=True
# would change legacy zip failure behavior.
select = ["E4", "E7", "E9", "F", "W", "I", "UP006", "UP007", "UP035", "B006", "B007", "B008", "B018", "B023", "SIM101", "SIM102", "SIM108", "SIM110", "SIM114"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "strategies", "research", "services", "scripts", "examples"]
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
# A reviewed per-file baseline counts legacy diagnostics. New diagnostics fail,
# and fixes must remove entries. No ignore_errors or application exclusions.

[[tool.mypy.overrides]]
module = ["hikyuu.*", "rqalpha.*", "akshare.*", "cnequity.*"]
ignore_missing_imports = true
# Optional third-party frameworks are absent in CI and lack stubs.

[[tool.mypy.overrides]]
module = ["src.notifications.*", "src.data.schema", "src.data.calendar", "scripts.engineering.*", "examples.minimal_demo.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Preserve source bytes required by autonomous_code_integrity_v1.json.
