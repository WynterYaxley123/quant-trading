repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Only immutable archives, metadata and third-party notices preserve bytes.
        exclude: &certified_bytes ^(?:docs/archive/|reports/etf_quant/|strategies/etf_quant/config/|dashboard/licenses/)
      - id: end-of-file-fixer
        exclude: *certified_bytes
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=no]
        exclude: *certified_bytes
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff-check
      - id: ruff-format
