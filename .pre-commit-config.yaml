repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Certified/historical documents preserve bytes and Markdown breaks.
        exclude: &certified_bytes |
          (?x)^(?:
            docs/ |
            reports/ |
            AGENTS\.md$ |
            strategies/etf_quant/config/ |
            dashboard/licenses/ |
            strategies/etf_quant/__init__\.py$ |
            strategies/etf_quant/config/__init__\.py$ |
            strategies/etf_quant/data/__init__\.py$ |
            strategies/etf_quant/data/membership\.py$ |
            strategies/etf_quant/data/source_c\.py$ |
            strategies/etf_quant/data/tradability\.py$ |
            strategies/etf_quant/domain/__init__\.py$ |
            strategies/etf_quant/domain/industry_level\.py$ |
            strategies/etf_quant/evidence/__init__\.py$ |
            strategies/etf_quant/evidence/builder\.py$ |
            strategies/etf_quant/evidence/schema\.py$ |
            strategies/etf_quant/evidence/sources\.py$ |
            strategies/etf_quant/evidence/strict\.py$ |
            strategies/etf_quant/factors/__init__\.py$ |
            strategies/etf_quant/mapping/__init__\.py$ |
            strategies/etf_quant/mapping/liquidity\.py$ |
            strategies/etf_quant/mapping/partial\.py$ |
            strategies/etf_quant/mapping/pit\.py$ |
            strategies/etf_quant/mapping/proxy\.py$ |
            strategies/etf_quant/mapping/registry\.py$ |
            strategies/etf_quant/models/__init__\.py$ |
            strategies/etf_quant/models/fusion\.py$ |
            strategies/etf_quant/portfolio/__init__\.py$ |
            strategies/etf_quant/portfolio/partial\.py$ |
            strategies/etf_quant/portfolio/policy\.py$ |
            strategies/etf_quant/runtime/__init__\.py$ |
            strategies/etf_quant/runtime/cli\.py$ |
            strategies/etf_quant/runtime/exports\.py$ |
            strategies/etf_quant/runtime/formal\.py$ |
            strategies/etf_quant/runtime/industry\.py$ |
            strategies/etf_quant/runtime/oneshot\.py$ |
            strategies/etf_quant/runtime/prediction\.py$ |
            strategies/etf_quant/runtime/shadow\.py$ |
            strategies/etf_quant/runtime/storage\.py$ |
            strategies/etf_quant/runtime/view\.py$ |
            strategies/etf_quant/schemas/__init__\.py$ |
            strategies/etf_quant/simulation/__init__\.py$ |
            strategies/etf_quant/simulation/lots\.py$ |
            services/etf-quant-runner/one_shot\.py$ |
            services/etf-quant-runner/run\.py$ |
            services/cnequity-sidecar/forward\.py$ |
            services/cnequity-sidecar/finalization\.py$ |
            services/cnequity-sidecar/expected_bars\.py$ |
            services/cnequity-sidecar/source_compatibility\.py$ |
            services/cnequity-sidecar/bse_tip_bridge\.py$ |
            services/cnequity-sidecar/status_evidence\.py$ |
            strategies/etf_quant/runtime/model_inputs\.py$
          )
      - id: end-of-file-fixer
        exclude: *certified_bytes
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=no]
        exclude: *certified_bytes
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff-check
      - id: ruff-format
