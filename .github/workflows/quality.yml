name: Public repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Audit inspects Git history, never private runtime data.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: python -m pip install pre-commit==4.3.0
      - run: pre-commit run --all-files
      - run: node services/etf-quant-runner/security-audit.mjs
      - run: python -m scripts.engineering.naming

  python-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Synthetic parity compares frozen pre-transition source.
      - name: Independent Docker quantitative checks
        run: |
          docker build -f .devcontainer/Dockerfile -t quant-trading-dev:ci .
          docker run --rm --network none -v "$PWD:/workspace" quant-trading-dev:ci bash -euc '
            git config --global --add safe.directory /workspace
            ruff check .
            ruff format --check .
            python scripts/engineering/typecheck.py
            python -m pytest -q -m "not external_runtime"
            python -m examples.minimal_demo
            python -m examples.industry_forecast_demo
            python -m examples.prospective_evidence_demo
            python -m scripts.engineering.source_qualification --verify
            python -m research.evidence.qualification
            python -m research.swl1_short_horizon_exploration --verify-public
            python -m research.swl1_rev10_short_v1
            python -m scripts.engineering.benchmark
            python -m pytest -q tests/performance
            python -m scripts.engineering.references
          '
      - name: Actual isolated synthetic Docker worker adversarial acceptance
        run: node scripts/engineering/prospective-isolation.mjs "$PWD" "$RUNNER_TEMP/prospective-evidence" quant-trading-dev:ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.25.0'
      - run: pnpm --dir dashboard install --frozen-lockfile
      - run: pnpm --dir dashboard test --maxWorkers=1
      - run: pnpm --dir dashboard typecheck
      - run: pnpm --dir dashboard lint
      - run: pnpm --dir dashboard build

  research-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.25.0'
      - run: pnpm --dir services/research-api install --frozen-lockfile
      - run: pnpm --dir services/research-api test
      - run: pnpm --dir services/research-api typecheck
      - run: pnpm --dir services/research-api build

  etf-api-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: node --test services/etf-quant-api/tests/*.test.mjs services/etf-quant-runner/security-audit.test.mjs scripts/tests/operations.test.mjs
      - run: node --test services/industry-forecast-api/tests/*.test.mjs
      - run: node --test scripts/tests/evidence-isolation.test.mjs
      - run: node --check services/industry-forecast-api/server.mjs

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: node --test scripts/tests/launcher-unit.test.mjs scripts/tests/scheduler.test.mjs scripts/tests/operations.test.mjs
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - run: pnpm --dir services/research-api install --frozen-lockfile
      - run: node --test scripts/tests/rev10-launcher.test.mjs
      - run: node --test scripts/tests/evidence-isolation.test.mjs
